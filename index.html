<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bubbles Car Care — Premium Car Detailing &amp; Paint Protection, Karachi</title>
<meta name="description" content="PPF, ceramic coating, anti-rust and detailing for daily-driven cars in Karachi. Two branches — DHA and North Nazimabad. Gtechniq-approved.">
<meta name="theme-color" content="#080808">
<link rel="icon" href="./assets/logo.png">
<meta property="og:title" content="Bubbles Car Care — Karachi">
<meta property="og:description" content="Paint protection and detailing for cars that get driven every day. Two branches, one standard.">
<meta property="og:image" content="./assets/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="./styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-bundle.js"></script>
<style>#root{min-height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react" src="data.jsx"></script>
<script type="text/babel" data-presets="react" src="home-screen.jsx"></script>
<script type="text/babel" data-presets="react" src="service-screens.jsx"></script>
<script type="text/babel" data-presets="react" src="projects-screen.jsx"></script>
<script type="text/babel" data-presets="react" src="videos-screen.jsx"></script>
<script type="text/babel" data-presets="react" src="book-screen.jsx"></script>
<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect } = React;
const { NavHeader, MobileNav, Footer, WhatsAppCta } = window.BubblesCarCareDesignSystem_459ca2;

const LINKS = [
  { id: 'home', label: 'Home' },
  { id: 'services', label: 'Services' },
  { id: 'coatings', label: 'Coatings' },
  { id: 'projects', label: 'Projects' },
  { id: 'videos', label: 'Videos' },
  { id: 'testimonials', label: 'Reviews' },
  { id: 'book', label: 'Book' },
];

function App() {
  const [route, setRoute] = useState('home');
  const [menu, setMenu] = useState(false);
  const [compact, setCompact] = useState(false);

  useEffect(() => {
    const mq = window.matchMedia('(max-width: 1020px)');
    const sync = () => setCompact(mq.matches);
    sync();
    mq.addEventListener('change', sync);
    return () => mq.removeEventListener('change', sync);
  }, []);

  useEffect(() => { if (!compact && menu) setMenu(false); }, [compact, menu]);

  const serviceIds = window.BCC.SERVICES.map((s) => s.id);
  const go = (id) => { setRoute(id); setMenu(false); window.scrollTo(0, 0); };
  const navCurrent = serviceIds.includes(route) ? 'services' : route;

  let screen;
  if (route === 'home') {
    screen = (
      <>
        <window.Hero onNavigate={go} />
        <window.CredStrip />
        <window.ServicesPreview onOpen={go} />
        <window.VideosPreview onNavigate={go} />
        <window.WhyUs />
        <window.ProjectsPreview onNavigate={go} />
        <window.TestimonialsPreview onNavigate={go} />
      </>
    );
  } else if (route === 'services') {
    screen = <window.ServicesIndexScreen onNavigate={go} />;
  } else if (route === 'coatings') {
    screen = <window.CoatingsScreen onNavigate={go} />;
  } else if (route === 'videos') {
    screen = <window.VideosScreen onNavigate={go} />;
  } else if (route === 'projects') {
    screen = <window.ProjectsScreen onNavigate={go} />;
  } else if (route === 'testimonials') {
    screen = <window.TestimonialsScreen onNavigate={go} />;
  } else if (route === 'book') {
    screen = <window.BookScreen onNavigate={go} />;
  } else {
    screen = <window.ServiceScreen key={route} id={route} onNavigate={go} />;
  }

  return (
    <div style={{ position: 'relative', minHeight: '100vh' }}>
      <NavHeader
        links={LINKS}
        current={navCurrent}
        compact={compact}
        logoSrc="./assets/logo.png"
        onNavigate={go}
        onBurger={() => setMenu(true)}
      />
      <main key={route} style={{ animation: 'bcc-fade-in var(--dur) var(--ease-out) both' }}>{screen}</main>
      <Footer
        logoSrc="./assets/logo.png"
        branches={window.BCC.BRANCHES}
        serviceLinks={window.BCC.SERVICES.slice(0, 5).map((s) => ({ id: s.id, label: s.title }))}
        onNavigate={go}
      />
      <WhatsAppCta floating compact={compact} label="Book on WhatsApp" />
      <MobileNav open={menu} links={LINKS} current={navCurrent} logoSrc="./assets/logo.png" onNavigate={go} onClose={() => setMenu(false)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
